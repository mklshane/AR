<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Target Compiler</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; background: #0f1724; color: #e8eef7; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      img { max-width: 120px; border-radius: 6px; margin: 4px; }
      button { font: inherit; padding: 10px 18px; border-radius: 999px; border: 0; background: #f2b8c6; color: #1f3b5c; font-weight: 700; cursor: pointer; }
      progress { width: 100%; }
      code { background: #1f2a3b; padding: 1px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>MindAR target compiler</h1>
    <p>Compiles every target image in <code>src/data/targets.ts</code> (in <code>targetIndex</code> order) into <code>public/targets/targets.mind</code>. Dev server only.</p>
    <div id="images"></div>
    <p><button id="go">Compile targets</button></p>
    <progress id="bar" max="100" value="0"></progress>
    <p id="status">Idle.</p>
    <script type="module" src="/src/dev/compile.ts"></script>
  </body>
</html>
